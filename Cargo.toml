[workspace]
resolver = "2"
members = ["crates/advanced-http-client", "crates/advanced-http-plugin"]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/MikanseiLaboratory/streamdeck-advanced-http"

[workspace.dependencies]
anyhow = "1"
futures = "0.3"
reqwest = { version = "0.12", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
ts-rs = "10.1"

[workspace.lints.rust]
unsafe_code = "forbid"
